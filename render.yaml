services:
  - type: web
    name: whatsapp-real-estate-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: AI_PROVIDER
        value: gemini
      - key: AUTO_REPLY_ENABLED
        value: true
      - key: GEMINI_API_KEY
        sync: false
